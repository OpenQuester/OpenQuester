name: Test

on:
  workflow_dispatch:
    inputs:
      RUN_CLIENT:
        description: Run client validation and code generation
        type: boolean
        default: true
      RUN_SERVER:
        description: Run server lint and tests
        type: boolean
        default: true
  workflow_call:
    inputs:
      RUN_CLIENT:
        type: boolean
        default: true
      RUN_SERVER:
        type: boolean
        default: true

jobs:
  test_server:
    if: ${{ inputs.RUN_SERVER }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      SESSION_SECRET: test_secret
      REDIS_URL: redis://localhost:6379/12
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: test_db
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4

      - name: Use the latest stable Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ./server/.node-version
          cache: npm
          cache-dependency-path: ./server/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: until pg_isready -h localhost -p 5432; do sleep 1; done
      - run: until docker run --rm --network host redis:7 redis-cli -h localhost -p 6379 ping; do sleep 1; done
      - run: npm run test:pipeline

  test_client:
    if: ${{ inputs.RUN_CLIENT }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    environment: ${{ github.workflow == 'Release' && 'openquester (Production)' || 'openquester (Preview)' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: ./client/apps/client/pubspec.yaml
          cache: true
          pub-cache: true

      - name: Install dependencies
        id: client_env
        run: |
          echo "${{ vars.ENV_FILE_CONTENT }}" > .env
          echo "hash=$(sha256sum .env | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          flutter pub get

      - name: Restore build-runner cache
        uses: actions/cache@v4
        with:
          path: client/.dart_tool/build/
          key: client-codegen-${{ runner.os }}-${{ steps.client_env.outputs.hash }}-${{ hashFiles('client/pubspec.lock', 'client/**/pubspec.yaml', 'client/**/build.yaml') }}-${{ github.sha }}
          restore-keys: |
            client-codegen-${{ runner.os }}-${{ steps.client_env.outputs.hash }}-${{ hashFiles('client/pubspec.lock', 'client/**/pubspec.yaml', 'client/**/build.yaml') }}-
            client-codegen-${{ runner.os }}-${{ steps.client_env.outputs.hash }}-

      - name: Run code generation (pre_build)
        run: dart run melos run pre_build

      - name: Check code formatting
        run: |
          dart run melos run format_exception
          dart run melos run format_check

      - name: Analyze Dart code
        run: dart run melos run analyze

      - name: Share generated client sources with build jobs
        uses: actions/upload-artifact@v4
        with:
          name: client-codegen
          path: |
            client/apps/client/lib/
            client/apps/client/web/workers/
            client/packages/*/lib/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
