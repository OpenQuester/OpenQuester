name: Test

on:
  workflow_dispatch:
    inputs:
      backend_reliability:
        description: "Run five independent focused and two full backend passes on this commit"
        type: boolean
        default: false
  workflow_call:
    inputs:
      backend_reliability:
        type: boolean
        default: false

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_run_server: ${{ steps.found_paths.outputs.server == 'true' || steps.should_force.outputs.should_force == 'true' }}
      should_run_client: ${{ steps.found_paths.outputs.client == 'true' || steps.should_force.outputs.should_force == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: found_paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'server/**'
            client:
              - 'client/**'
              - 'openapi/**'

      - name: Check if we should force jobs to run
        id: should_force
        run: echo "should_force=${{ github.event_name == 'workflow_dispatch' || github.workflow == 'Release'}}" >> "$GITHUB_OUTPUT"

  test_server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_run_server == 'true' }}
    services:
      postgres:
        image: postgres:16.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      SESSION_SECRET: test_secret
      TEST_REDIS_HOST: 127.0.0.1
      TEST_REDIS_PORT: 6379
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 5432
      TEST_DB_USER: postgres
      TEST_DB_PASS: postgres
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
      - name: Use the latest stable Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ./server/.node-version
          cache: "npm"
          cache-dependency-path: ./server/package-lock.json
      - run: npm ci
        id: install
      - name: Prepare commit-bound test artifacts
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/commit.txt
      - run: npm run lint
      - run: npm run build
      - name: E2E infrastructure self-tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:pipeline -- tests/e2e/scenario tests/e2e/contracts tests/socket/game/utils tests/e2e/harness/SocketClientTestUtils.test.ts tests/e2e/flows/media-download/MediaDownloadFlow.test.ts --runInBand --json --outputFile=test-results/infrastructure.json
      - name: High-risk transport scenarios
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          RUNS: ${{ inputs.backend_reliability && '5' || '1' }}
        run: |
          status=0
          for ((run=1; run<=RUNS; run++)); do
            code=0
            npm run test:pipeline -- tests/e2e/flows/MediaDownloadScenario.test.ts tests/e2e/flows/MediaDownloadEdgeScenario.test.ts tests/socket/game/queue tests/user/UserNotificationRooms.test.ts tests/socket/game/question/ChoiceQuestionFlow.test.ts --runInBand --json --outputFile="test-results/high-risk-$run.json" || code=$?
            echo "$code" > "test-results/high-risk-$run.exit-code"
            if ((code != 0)); then status=$code; fi
          done
          exit "$status"
      - name: Full backend test suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          RUNS: ${{ inputs.backend_reliability && '2' || '1' }}
        run: |
          status=0
          for ((run=1; run<=RUNS; run++)); do
            code=0
            npm run test:pipeline -- --json --outputFile="test-results/full-$run.json" || code=$?
            echo "$code" > "test-results/full-$run.exit-code"
            if ((code != 0)); then status=$code; fi
          done
          exit "$status"
      - name: Preserve backend results (including failures)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: server/test-results/
          if-no-files-found: error

  test_client:
    runs-on: ubuntu-latest
    needs: pre_job
    if: ${{ !inputs.backend_reliability && needs.pre_job.outputs.should_run_client == 'true' }}
    defaults:
      run:
        working-directory: ./client
    environment: "${{ github.event_name == 'workflow_call' && 'openquester (Production)' || 'openquester (Preview)' }}"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: ./client/apps/client/pubspec.yaml
          cache: true

      - name: Install dependencies & Bootstrap
        run: |
          echo "${{ vars.ENV_FILE_CONTENT }}" > apps/client/.env
          flutter pub get
          dart pub global activate melos 7.8.1
          melos bootstrap

      - name: Run code generation (pre_build)
        run: melos run pre_build

      - name: Check code formatting
        run: |
          melos run format_exception
          melos run format_check

      - name: Analyze Dart code
        run: melos run analyze

      - name: Run Tests
        if: false # Skipped for now
        run: melos run test
