name: Build Client

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      ANDROID_KEYSTORE_BASE64:
        required: true
      WINDOWS_SIGN_CERT:
        required: true
      PLAY_STORE_SERVICE_ACCOUNT_JSON:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_ZONE:
        required: false
    inputs:
      DEPLOY_PROD:
        type: boolean
        default: false
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-client-${{ inputs.DEPLOY_PROD }}
  cancel-in-progress: true

jobs:
  pre_job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.found_paths.outputs.client == 'true' || steps.should_force.outputs.should_force == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: found_paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            client:
              - 'client/**'
              - 'openapi/**'
              - '.github/workflows/build_client.yml'
              - '.github/workflows/test.yml'

      - name: Check if we should force jobs to run
        id: should_force
        run: echo "should_force=${{ github.event_name == 'workflow_dispatch' || github.workflow == 'Release' }}" >> "$GITHUB_OUTPUT"

  test:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_run == 'true' }}
    uses: ./.github/workflows/test.yml
    with:
      RUN_CLIENT: true
      RUN_SERVER: false
    permissions:
      contents: read

  build_web:
    name: Build client (Web)
    needs: test
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    environment: ${{ inputs.DEPLOY_PROD && 'openquester (Production)' || 'openquester (Preview)' }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore generated client sources
        uses: actions/download-artifact@v4
        with:
          name: client-codegen
          path: ./client

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: ./client/apps/client/pubspec.yaml
          cache: true
          pub-cache: true

      - name: Restore Web build cache
        uses: actions/cache@v4
        with:
          path: |
            client/apps/client/.dart_tool/flutter_build/
            client/apps/client/build/web/
          key: client-build-web-${{ runner.os }}-${{ hashFiles('client/pubspec.lock', 'client/apps/client/pubspec.yaml') }}-${{ github.sha }}
          restore-keys: |
            client-build-web-${{ runner.os }}-${{ hashFiles('client/pubspec.lock', 'client/apps/client/pubspec.yaml') }}-
            client-build-web-${{ runner.os }}-

      - name: Install dependencies
        run: |
          echo "${{ vars.ENV_FILE_CONTENT }}" > .env
          flutter pub get

      - name: Build Web
        working-directory: ./client/apps/client
        run: flutter build web --no-web-resources-cdn --build-number "$GITHUB_RUN_NUMBER" --wasm

      - name: Publish Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: ./client/apps/client/build/web/

      - name: Publish to Cloudflare Pages (Preview)
        if: inputs.DEPLOY_PROD != true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy ./client/apps/client/build/web/ --project-name=openquester-dev --branch ${{ github.ref_name }}

      - name: Purge Cloudflare cache
        if: inputs.DEPLOY_PROD != true
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{ "purge_everything": true }'

  build_android:
    name: Build client (Android)
    needs: test
    if: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    environment: ${{ inputs.DEPLOY_PROD && 'openquester (Production)' || 'openquester (Preview)' }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore generated client sources
        uses: actions/download-artifact@v4
        with:
          name: client-codegen
          path: ./client

      - name: Setup Java 17 + Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: ./client/apps/client/pubspec.yaml
          cache: true
          pub-cache: true

      - name: Restore Android build cache
        uses: actions/cache@v4
        with:
          path: |
            client/apps/client/.dart_tool/flutter_build/
            client/apps/client/build/app/
          key: client-build-android-${{ runner.os }}-${{ hashFiles('client/pubspec.lock', 'client/apps/client/pubspec.yaml') }}-${{ github.sha }}
          restore-keys: |
            client-build-android-${{ runner.os }}-${{ hashFiles('client/pubspec.lock', 'client/apps/client/pubspec.yaml') }}-
            client-build-android-${{ runner.os }}-

      - name: Install dependencies
        run: |
          echo "${{ vars.ENV_FILE_CONTENT }}" > .env
          flutter pub get

      - name: Decode and setup Android keystore
        working-directory: ./client/apps/client
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Android APKs
        working-directory: ./client/apps/client
        run: flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"
        env:
          ANDROID_KEYSTORE_PATH: ${{ vars.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEY_ALIAS_NAME: ${{ vars.ANDROID_KEY_ALIAS_NAME }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Publish Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: ./client/apps/client/build/app/outputs/flutter-apk/*.apk

      - name: Build Android Bundle (AAB)
        if: github.ref == 'refs/heads/main'
        working-directory: ./client/apps/client
        run: flutter build appbundle --release --build-number "$GITHUB_RUN_NUMBER"
        env:
          ANDROID_KEYSTORE_PATH: ${{ vars.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEY_ALIAS_NAME: ${{ vars.ANDROID_KEY_ALIAS_NAME }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload to Play Store (Internal Testing)
        if: github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.asion.openquester
          releaseFiles: ./client/apps/client/build/app/outputs/bundle/release/*.aab
          track: internal
          status: draft
          inAppUpdatePriority: 3

  build_windows:
    name: Build client (Windows)
    needs: test
    if: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
    environment: ${{ inputs.DEPLOY_PROD && 'openquester (Production)' || 'openquester (Preview)' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4

      - name: Restore generated client sources
        uses: actions/download-artifact@v4
        with:
          name: client-codegen
          path: ./client

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: ./client/apps/client/pubspec.yaml
          cache: true
          pub-cache: true

      - name: Restore Windows build cache
        uses: actions/cache@v4
        with:
          path: |
            client/apps/client/.dart_tool/flutter_build/
            client/apps/client/build/windows/
          key: client-build-windows-${{ runner.os }}-${{ hashFiles('client/pubspec.lock', 'client/apps/client/pubspec.yaml') }}-${{ github.sha }}
          restore-keys: |
            client-build-windows-${{ runner.os }}-${{ hashFiles('client/pubspec.lock', 'client/apps/client/pubspec.yaml') }}-
            client-build-windows-${{ runner.os }}-

      - name: Install dependencies
        run: |
          echo "${{ vars.ENV_FILE_CONTENT }}" > .env
          flutter pub get

      - name: Build and create bundle
        working-directory: ./client/apps/client
        run: |
          flutter build windows --release --build-number "${{ github.run_number }}"
          dart run inno_bundle:build --release --no-app

      - name: Publish Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: ./client/apps/client/build/windows/x64/installer/Release/*-Installer.exe

  build_linux:
    name: Build client (Linux)
    needs: test
    if: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
    environment: ${{ inputs.DEPLOY_PROD && 'openquester (Production)' || 'openquester (Preview)' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4

      - name: Restore generated client sources
        uses: actions/download-artifact@v4
        with:
          name: client-codegen
          path: ./client

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: ./client/apps/client/pubspec.yaml
          cache: true
          pub-cache: true

      - name: Restore Linux build cache
        uses: actions/cache@v4
        with:
          path: |
            client/apps/client/.dart_tool/flutter_build/
            client/apps/client/build/linux/
          key: client-build-linux-${{ runner.os }}-${{ hashFiles('client/pubspec.lock', 'client/apps/client/pubspec.yaml') }}-${{ github.sha }}
          restore-keys: |
            client-build-linux-${{ runner.os }}-${{ hashFiles('client/pubspec.lock', 'client/apps/client/pubspec.yaml') }}-
            client-build-linux-${{ runner.os }}-

      - name: Restore Flatpak builder cache
        uses: actions/cache@v4
        with:
          path: client/apps/client/linux/.flatpak-builder/
          key: flatpak-builder-${{ runner.os }}-${{ hashFiles('client/apps/client/linux/com.asion.openquester.yml') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev \
            ffmpeg libavcodec-dev libavformat-dev libavutil-dev \
            libwebkit2gtk-4.1-dev libsecret-1-dev \
            desktop-file-utils appstream
          echo "${{ vars.ENV_FILE_CONTENT }}" > .env
          flutter pub get

      - name: Build Linux application
        working-directory: ./client/apps/client
        run: flutter build linux --release --build-number "${{ github.run_number }}"

      - name: Create tar.gz archive
        working-directory: ./client/apps/client
        run: tar -czf "$GITHUB_WORKSPACE/openquester-linux-x64.tar.gz" -C build/linux/x64/release bundle/

      - name: Publish Linux tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar-gz
          path: openquester-linux-x64.tar.gz

      - name: Build AppImage
        working-directory: ./client/apps/client
        run: |
          chmod +x linux/build-appimage.sh
          linux/build-appimage.sh build/linux/x64/release/bundle build/linux/appimage

      - name: Publish AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: ./client/apps/client/build/linux/appimage/OpenQuester-x86_64.AppImage

      - name: Install Flatpak and dependencies
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08

      - name: Build Flatpak
        working-directory: ./client/apps/client/linux
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo build-flatpak com.asion.openquester.yml
          flatpak build-bundle repo openquester.flatpak com.asion.openquester

      - name: Publish Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: ./client/apps/client/linux/openquester.flatpak
